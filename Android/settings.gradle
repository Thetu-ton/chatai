rootProject.name = 'aurora-imui'

include ':exampleui', ':messagelist', ':chatinput'
project(':exampleui').projectDir = new File(rootProject.projectDir, 'sample/exampleui')
project(':messagelist').projectDir = new File(rootProject.projectDir, 'messagelist')
